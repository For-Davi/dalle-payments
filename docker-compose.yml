services:
    payments:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'dalle_payments/app'
        container_name: dalle_payments_app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-82}:80'
            - '${VITE_PORT:-5175}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - manage-network  # 👈 mesma rede do dalle-manage
        depends_on:
            - mysql

    ngrok:
        image: ngrok/ngrok:latest
        container_name: dalle_payments_ngrok
        restart: unless-stopped
        ports:
            - '4040:4040'
        environment:
            NGROK_AUTHTOKEN: '${NGROK_AUTHTOKEN}'
            NGROK_DOMAIN: '${NGROK_DOMAIN}'
        command: ["http", "dalle_payments_app:80", "--url=${NGROK_DOMAIN}"]
        networks:
            - manage-network
        depends_on:
            - payments

    mysql:
        image: 'mysql/mysql-server:8.0'
        container_name: dalle_payments_mysql
        ports:
            - '${FORWARD_DB_PORT:-3308}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'dalle_payments_mysql:/var/lib/mysql'
        networks:
            - manage-network
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

networks:
    manage-network:
        driver: bridge
        external: true

volumes:
    dalle_payments_mysql:
        driver: local
